# CANDIDATE pre-registration: 2026 NFL REG weeks 5-18 out-of-sample tracking (written 2026-10-04 PT by the builder,
# from Tester1's DRAFT /workspace/tester1-review/v2/prereg_2026_wk5-18_DRAFT.yaml, sha1 bea5258d...).
# STATUS: NOT BINDING. It becomes binding only when yinzerduck (1) reviews it, (2) resolves the OPEN items below,
#   (3) commits it and publishes its sha1 in a dated file BEFORE the first week-5 kickoff (Thu 2026-10-08 17:15 PT),
#   and (4) never edits it again. Any later change = a new pre-registration with its own sha1.
version: 1
scope: {season: 2026, game_type: REG, weeks: [5, 18]}
